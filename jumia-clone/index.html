<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumia Clone - Home</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">Jumia</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart <span id="cart-count" class="badge bg-primary">0</span></a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero bg-primary text-white py-5">
        <div class="container">
            <div class="row">
                <div class="col-lg-6">
                    <h1>Welcome to Jumia</h1>
                    <p>Your one-stop shop for everything</p>
                    <a href="products.html" class="btn btn-light">Shop Now</a>
                </div>
                <div class="col-lg-6">
                    <img src="https://via.placeholder.com/500x300" alt="Hero Image" class="img-fluid">
                </div>
            </div>
        </div>
    </section>

    <!-- Categories -->
    <section class="categories py-5">
        <div class="container">
            <h2 class="text-center mb-4">Shop by Category</h2>
            <div class="row">
                <div class="col-md-3">
                    <div class="category-card text-center">
                        <img src="https://via.placeholder.com/200x200" alt="Electronics" class="img-fluid">
                        <h5>Electronics</h5>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="category-card text-center">
                        <img src="https://via.placeholder.com/200x200" alt="Fashion" class="img-fluid">
                        <h5>Fashion</h5>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="category-card text-center">
                        <img src="https://via.placeholder.com/200x200" alt="Home & Garden" class="img-fluid">
                        <h5>Home & Garden</h5>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="category-card text-center">
                        <img src="https://via.placeholder.com/200x200" alt="Sports" class="img-fluid">
                        <h5>Sports</h5>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Featured Products -->
    <section class="featured-products py-5 bg-light">
        <div class="container">
            <h2 class="text-center mb-4">Featured Products</h2>
            <div class="row" id="featured-products">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2023 Jumia Clone. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
